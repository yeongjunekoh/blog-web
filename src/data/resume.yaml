name: 고영준
title: "Product Manager · Product Engineer"
summary: >-
  고객, 데이터, 법·제도를 분석해 진짜 문제를 정의하고 팀과 함께 해결하는
  PM입니다. 프론트엔드 엔지니어로 시작해, 2024년부터 케어링에서 기획과
  개발을 오가며 장기요양 도메인의 제품을 만듭니다.

about:
  - >-
    전기공학을 공부하던 시절 마케팅 공모전 10여 개에 참여하면서 서비스가
    사람들에게 주는 긍정적 가치를 처음 생각하게 됐고, 그 가치를 직접 구현하고
    싶어 개발자가 되었습니다. 소프트웨어 마에스트로에서 PO와 프론트엔드
    엔지니어를 겸하며 팀을 이끌었고, 지금은 케어링에서 장기요양 도메인의
    ERP와 자동화 시스템을 기획하고 개발합니다.
  - >-
    저의 핵심은 제품, 비즈니스, 사용자, 소프트웨어에 대한 이해를 기반으로
    가치를 만들고 전달하는 것입니다. 모든 프로젝트의 시작점에서 목표와 문제를
    먼저 묻고, 결정은 문서로 남기며, 배포 후에는 회고로 배웁니다. 팀이 같은
    문제를 바라보고 실행할 때 제품의 가치가 가장 빠르게 만들어진다고 믿습니다.

