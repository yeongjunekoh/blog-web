# 걸어온 길 — 왜 이 일을 하는가
story:
  - >-
    전기공학을 공부하던 시절, 마케팅 공모전 10여 개에 참여하면서 서비스가
    사람들에게 주는 긍정적 가치를 처음 생각하게 됐습니다. 그 가치를 아이디어로
    말하는 데서 그치지 않고 직접 구현하고 싶어 개발자가 되었습니다.
  - >-
    소프트웨어 마에스트로 14기에서는 PO와 프론트엔드 엔지니어를 겸하며 팀을
    이끌었습니다. 절약 습관 형성 챌린지 플랫폼 'Savable'을 기획하고 개발해
    86팀 중 12팀이 선정되는 우수 프로젝트에 올랐고, 이때부터 기획과 개발을
    오가며 일하는 방식이 저의 기본값이 되었습니다.
  - >-
    지금은 케어링에서 장기요양(시니어케어) 도메인의 PM으로 일합니다. 공단
    고시와 양식이 업무 전반을 규정하고 데이터 오류가 곧 제재로 이어지는 규제
    산업에서, 법과 고시를 직접 읽고 제품에 반영하며 사람에 기대던 운영을
    시스템으로 옮기는 일을 합니다.
  - >-
    이 블로그는 임팩트를 내며 배운 것을 기록하기 위해 만들었습니다. 글로
    남기지 않은 배움은 흩어진다고 믿기 때문에, 문제를 풀어낸 과정과 그때의
    판단을 글로 남깁니다.

# 일하는 원칙 — 각 원칙은 그것을 증명하는 글·기록으로 뒷받침한다
principles:
  - title: "문제를 먼저 정의한다"
    body: >-
      모든 프로젝트의 시작점에서 목표와 문제를 먼저 묻습니다. 솔루션이 아니라
      문제에서 출발해야 팀이 같은 곳을 바라볼 수 있고, 팀이 같은 문제를
      바라보고 실행할 때 제품의 가치가 가장 빠르게 만들어진다고 믿습니다.
    links:
      - title: "PO는 어떤 역량을 강화해야 할까?"
        href: "/knowledge/po-core-competencies/"
  - title: "쓰이는 것이 성과다"
    body: >-
      기능과 자동화는 만든 순간이 아니라 쓰일 때 성과가 됩니다. 그래서 새
      도구를 만들기 전에 사용자가 이미 일하는 방식 안으로 들어갈 방법을 먼저
      찾고, 도입 마찰을 설계로 없앱니다.
    links:
      # 케이스 스터디 글 공개 전환 시 아래 링크로 교체:
      # - title: "쓰이는 자동화 만들기: 범죄경력조회 자동화 회고"
      #   href: "/blog/criminal-record-check-automation/"
      - title: "이력서 — 케어링에서의 자동화 프로젝트"
        href: "/resume/"
  - title: "결정은 문서로, 배움은 회고로 남긴다"
    body: >-
      결정은 문서로 남겨 팀의 산출물 방향을 맞추고, 배포 후에는 회고로
      배웁니다. 글쓰기는 저에게 기록 수단이자 생각을 검증하는 도구입니다.
    links:
      - title: "글쓰기와 언어 선택"
        href: "/knowledge/writing-and-word-choice/"
      - title: "2023년 회고 | SWM 14기 후기"
        href: "/blog/2023-retrospective-swm-14/"
  - title: "성장에는 방향이 있어야 한다"
    body: >-
      더 나아지려는 노력만큼, 어디로 나아갈지를 스스로 정의하는 일을
      중요하게 생각합니다. 좋은 엔지니어란 무엇인지, 나는 무엇을 가지고
      싶은지를 계속 묻고 그 답을 글로 남깁니다.
    links:
      - title: "더 좋은 엔지니어가 되기 위한 한 걸음"
        href: "/blog/becoming-a-better-engineer/"
      - title: "『아비투스』를 읽고: '사회'에서 객관적으로 바라본 나"
        href: "/blog/habitus-book-review/"

